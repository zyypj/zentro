name: Release

# Crie uma tag (ex.: git tag v1.0.0 && git push origin v1.0.0) para publicar:
# servidor (.jar para o Pterodactyl), APK do Android e instaladores do desktop.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :shared:jvmTest :server:test :server:shadowJar :composeApp:assembleRelease

      - name: Organizar arquivos
        run: |
          mkdir -p out
          cp server/build/libs/zentro-server.jar out/zentro-server.jar
          cp composeApp/build/outputs/apk/release/*.apk out/Zentro.apk

      - uses: actions/upload-artifact@v5
        with:
          name: server-android
          path: out/*

  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            task: packageMsi packageExe
          - os: ubuntu-latest
            task: packageDeb
          - os: macos-latest
            task: packageDmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Gerar instalador
        shell: bash
        run: |
          for t in ${{ matrix.task }}; do ./gradlew ":composeApp:$t"; done

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.os }}
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/dmg/*.dmg

  publish:
    needs: [server-android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
